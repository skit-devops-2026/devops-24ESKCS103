server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location = /metrics {
        access_log off;
        default_type text/plain;
        return 200 "# HELP lifequest_up LifeQuest web server availability\n# TYPE lifequest_up gauge\nlifequest_up 1\n";
    }
}
